<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vexel — Intro</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050706; }
    body { display: grid; place-items: center; }
    #vexel-canvas {
      display: block;
      width: min(100vw, calc(100vh * 16 / 9)) !important;
      height: min(100vh, calc(100vw * 9 / 16)) !important;
      max-width: none !important; max-height: none !important;
      background: #050706; outline: 0; opacity: 0; transform: scale(1.025);
      transition: opacity .45s ease, transform .7s cubic-bezier(.2,.8,.2,1);
    }
    body.is-running #vexel-canvas { opacity: 1; transform: scale(1); }
    #boot {
      position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px;
      color: #a9aea5; font: 500 10px/1.2 ui-monospace, monospace; letter-spacing: 1.6px; text-transform: uppercase;
      transition: opacity .3s ease;
    }
    #boot::before { content: ""; width: 30px; height: 30px; border: 1px solid rgba(216,169,78,.25); border-top-color: #d8a94e; border-radius: 50%; animation: spin .8s linear infinite; }
    body.is-running #boot { opacity: 0; pointer-events: none; }
    #output { position: fixed; left: 8px; bottom: 8px; max-height: 25vh; margin: 0; overflow: hidden; color: transparent; font-size: 1px; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="boot" aria-live="polite">Cargando motor gráfico</div>
  <canvas id="vexel-canvas" width="960" height="540" tabindex="0" aria-label="Animación de introducción de Vexel"></canvas>
  <pre id="output" aria-hidden="true"></pre>
  <script>
    var Module = {
      canvas: document.getElementById("vexel-canvas"),
      print: function (text) {
        document.getElementById("output").textContent += text + "\n";
        console.log(text);
      },
      printErr: function (text) { console.error(text); },
      onRuntimeInitialized: function () { document.body.classList.add("is-running"); }
    };
    Module.canvas.addEventListener("click", function () { Module.canvas.focus(); });
  </script>
  <script async src="vexel-web.js"></script>
</body>
</html>
